crawler:
  user_agent: "RoadSafetyInsightsResearch/0.5 (+https://roadsafetyinsights.com; contact: info@roadsafetyinsights.com)"
  timeout_seconds: 25
  delay_seconds: 1.3

nominatim:
  url: "https://nominatim.openstreetmap.org/search"
  delay_seconds: 1.15
  timeout_seconds: 25
  cache_file: "output/geocode_cache.json"

crete:
  west: 23.30
  south: 34.70
  east: 26.50
  north: 35.85

quality:
  fetch_missing_dates: true
  repair_region_mismatches: true
  deduplicate: true
  marker_radius_m:
    street: 350
    junction: 300
    landmark: 600
    locality: 1200
    road_corridor: 3000

output:
  all_validated: "output/events_validated.json"
  app_ready: "output/accidents_app_ready.json"
  rejected: "output/rejected_review.json"
  duplicate_report: "output/duplicate_groups.json"
  quality_report: "output/quality_report.json"
